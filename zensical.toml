[project]
site_name = "Taxonomy of Dataset Changes for ML Pipeline Evolution"
site_description = "A taxonomy of tabular dataset changes and their implications for ML pipeline evolution."
site_author = "Abelló, Gómez, López, Ayala"
site_url = "https://MLSToolbox.github.io/dataset-changes-taxonomy/"
repo_url = "https://github.com/MLSToolbox/mls_dsc_taxonomy"
repo_name = "MLSToolbox/mls_dsc_taxonomy"
copyright = "Content licensed under CC BY 4.0"

nav = [
  { "Home" = "index.md" },
  { "Taxonomy" = [
    "taxonomy/index.md",
    "taxonomy/dataset-metadata/index.md",
    { "Columns set" = [
      "taxonomy/columns-set/index.md",
      "taxonomy/columns-set/columns-order.md",
      { "Column" = [
        "taxonomy/columns-set/column/add-column.md",
        "taxonomy/columns-set/column/remove-column.md",
        "taxonomy/columns-set/column/rename-column.md",
      ] },
    ] },
    { "Column characteristics" = [
      "taxonomy/column-characteristics/index.md",
      { "Categorical column" = [
        "taxonomy/column-characteristics/categorical/categorical-column-type.md",
        "taxonomy/column-characteristics/categorical/categorical-column-values.md",
      ] },
      { "Numerical column" = [
        "taxonomy/column-characteristics/numerical/numerical-column-type.md",
        "taxonomy/column-characteristics/numerical/numerical-column-values.md",
      ] },
    ] },
    { "Rows set" = [
      "taxonomy/rows-set/index.md",
      "taxonomy/rows-set/rows-order.md",
      { "Row" = [
        "taxonomy/rows-set/row/add-row.md",
        "taxonomy/rows-set/row/remove-row.md",
      ] },
    ] },
    { "Data characteristics" = [
      "taxonomy/data-characteristics/index.md",
      "taxonomy/data-characteristics/missings.md",
      "taxonomy/data-characteristics/correlation.md",
      "taxonomy/data-characteristics/data-distribution.md",
    ] },
  ] },
  { "Validation" = [
    "validation/census-income.md",
  ] },
  { "About" = "about.md" },
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

