[project]
site_name = "Taxonomy of Dataset Changes for ML Pipeline Evolution"
site_description = "A taxonomy of tabular dataset changes and their implications for ML pipeline evolution."
site_author = "Abelló, Gómez, López, Ayala"
# TODO: replace GITHUB_USER / REPO with your GitHub user (or organisation) and repository name
site_url = "https://GITHUB_USER.github.io/dataset-changes-taxonomy/"
repo_url = "https://github.com/GITHUB_USER/dataset-changes-taxonomy"
repo_name = "GITHUB_USER/dataset-changes-taxonomy"
copyright = "Content licensed under CC BY 4.0"

nav = [
  { "Home" = "index.md" },
  { "Taxonomy" = [
    # BEGIN GENERATED:nav
    "taxonomy/index.md",
    { "Metadata" = [
      "taxonomy/metadata/index.md",
      "taxonomy/metadata/associated-metadata.md",
    ] },
    { "Schema" = [
      "taxonomy/schema/index.md",
      { "Columns set" = [
        "taxonomy/schema/columns-set/index.md",
        "taxonomy/schema/columns-set/columns-order.md",
        { "Column" = [
          "taxonomy/schema/columns-set/column/extra-column.md",
          "taxonomy/schema/columns-set/column/absent-column.md",
          "taxonomy/schema/columns-set/column/rename-column.md",
        ] },
      ] },
      { "Column characteristics" = [
        "taxonomy/schema/column-characteristics/index.md",
        { "Categorical" = [
          "taxonomy/schema/column-characteristics/categorical/categorical-column-type.md",
          "taxonomy/schema/column-characteristics/categorical/categorical-column-values.md",
        ] },
        { "Numerical" = [
          "taxonomy/schema/column-characteristics/numerical/numerical-column-type.md",
          "taxonomy/schema/column-characteristics/numerical/numerical-column-values.md",
          "taxonomy/schema/column-characteristics/numerical/numerical-column-format.md",
        ] },
      ] },
    ] },
    { "Instances" = [
      "taxonomy/instances/index.md",
      { "Rows set" = [
        "taxonomy/instances/rows-set/index.md",
        "taxonomy/instances/rows-set/rows-order.md",
        { "Row" = [
          "taxonomy/instances/rows-set/row/extra-row.md",
          "taxonomy/instances/rows-set/row/absent-row.md",
        ] },
      ] },
      { "Data value" = [
        "taxonomy/instances/data-value/index.md",
        "taxonomy/instances/data-value/extra-missing.md",
        "taxonomy/instances/data-value/absent-missing.md",
        "taxonomy/instances/data-value/value-update.md",
      ] },
    ] },
    { "Storage" = [
      "taxonomy/storage/index.md",
      "taxonomy/storage/format.md",
      { "Fragmentation" = [
        "taxonomy/storage/fragmentation/index.md",
        "taxonomy/storage/fragmentation/horizontal.md",
        "taxonomy/storage/fragmentation/vertical.md",
      ] },
    ] },
    # END GENERATED:nav
  ] },
  { "About" = "about.md" },
]

[project.theme]
# variant = "classic"
# custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "en"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  # "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  # "navigation.instant.progress",
  "navigation.path",
  # "navigation.prune",
  "navigation.sections",
  # "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  # "toc.follow",
  # "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

