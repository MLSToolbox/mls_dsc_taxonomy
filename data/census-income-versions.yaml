# Table 1 of the paper: change types identified in nine versions of the
# Census Income (Adult) dataset, compared against the original UCI release.
# `changes` lists keys of change types defined in data/taxonomy.yaml.
original:
  name: Census Income (Adult), original
  url: https://archive.ics.uci.edu/dataset/2/adult
versions:
  - id: D1
    name: scikit-learn/adult-census-income
    url: https://huggingface.co/datasets/scikit-learn/adult-census-income
    changes: [dataset-metadata, rename-column, rows-order]
  - id: D2
    name: AiresPucrs/adult-census-income
    url: https://huggingface.co/datasets/AiresPucrs/adult-census-income
    changes: [dataset-metadata, rename-column, rows-order]
  - id: D3
    name: mstz/adult (income)
    url: https://huggingface.co/datasets/mstz/adult/tree/main/income
    changes: [dataset-metadata, columns-order, rename-column, categorical-column-type, categorical-column-values, rows-order, remove-row]
  - id: D4
    name: mstz/adult (income-no race)
    url: https://huggingface.co/datasets/mstz/adult/tree/main/income-no%20race
    changes: [dataset-metadata, columns-order, remove-column, rename-column, categorical-column-type, categorical-column-values, remove-row]
  - id: D5
    name: databoost/optimized_adult_census
    url: https://huggingface.co/datasets/databoost/optimized_adult_census
    changes: [dataset-metadata, add-column, rename-column, rows-order]
  - id: D6
    name: ETdanR/adult_income
    url: https://huggingface.co/datasets/ETdanR/adult_income
    changes: [dataset-metadata, rename-column, remove-row, data-distribution]
  - id: D7
    name: kuldeepbishnoi29/adult-fairness
    url: https://huggingface.co/datasets/kuldeepbishnoi29/adult-fairness
    changes: [dataset-metadata, remove-column, rename-column, categorical-column-values, add-row]
  - id: D8
    name: Zenodo record 12533514
    url: https://zenodo.org/records/12533514
    changes: [dataset-metadata, columns-order, add-column, remove-column, rename-column, categorical-column-values, numerical-column-type, numerical-column-values, remove-row]
  - id: D9
    name: AIF360 AdultDataset (v0.5.0)
    url: https://aif360.readthedocs.io/en/v0.5.0/modules/generated/aif360.datasets.AdultDataset.html
    changes: [dataset-metadata, remove-column, categorical-column-values, missings, correlation, data-distribution]
